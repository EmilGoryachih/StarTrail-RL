# docker-compose.yml
services:
  nginx:
    image: nginx:alpine
    container_name: startrail_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - app
    restart: always

  frontend:
    depends_on:
      - app
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: startrail_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://app:8000/api
    expose:
      - "3000"
    volumes:
      - ./Frontend:/app
      - /app/node_modules
    command: [ "pnpm", "run", "dev" ]
    restart: always

  app:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: startrail_backend
    expose:
      - "8000"
    depends_on:
      - db
    environment:
      DATABASE_USER: emil
      DATABASE_PASSWORD: emilgan12
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: fastupdb
      SECRET_KEY: your-secret-key-change-in-production-min-32-chars
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_MINUTES: 10080
      ACCESS_EXPIRE: 30
      OWNER_EMAIL: admin@startrail.ai
      OWNER_PASSWORD: admin123
      EMBED_MODEL: /app/cache/all-MiniLM-L6-v2
    volumes:
      - ./Backend:/usr/src/app
      - ./Model:/usr/src/Model
      - ./cache:/app/cache
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: always

  db:
    image: postgres:15
    container_name: startrail_db
    restart: always
    expose:
      - "5432"
    environment:
      POSTGRES_USER: emil
      POSTGRES_PASSWORD: emilgan12
      POSTGRES_DB: fastupdb
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
